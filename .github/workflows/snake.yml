name: generate snake

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
              dist/github-snake-pink.svg?color_snake=#D96C9D&color_dots=#F8D7E5,#F4A6C1,#E58CB3,#D96C9D,#B85C86
              dist/github-snake-pink-dark.svg?color_snake=#F4A6C1&color_dots=#2A1E26,#5A3245,#8A4D6A,#C96D96,#F4A6C1

      - name: push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
